name: publish-release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi

          ASSET="Evgenium_SpeedRun-${TAG}-mc26.2.jar"
          cp "$JAR" "$ASSET"

          cat > release-notes.md <<EOF
          # Evgenium SpeedRun ${TAG}

          First installable development build of Evgenium SpeedRun.

          ## Requirements

          - Minecraft Java Edition 26.2
          - Fabric Loader 0.19.3
          - Fabric API 0.156.0+26.2
          - Java 25

          ## Included

          - Fabric project foundation and client/common entrypoints
          - client state model for menu, lobby, match, world and RNG systems
          - first EvgeniumMainScreen implementation
          - reproducible GitHub Actions builds

          ## Important

          This is an early alpha foundation. EvgeniumMainScreen exists in the codebase but does not yet replace Minecraft's vanilla title screen. Lobby networking, synchronized starts and competitive RNG are not implemented yet.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Evgenium SpeedRun ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Evgenium SpeedRun ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          fi
