name: release-v0.1.0-alpha.1

on:
  push:
    branches:
      - release/v0.1.0-alpha.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi
          RELEASE_JAR="release/Evgenium_SpeedRun-v0.1.0-alpha.1-mc26.2.jar"
          cp "$JAR" "$RELEASE_JAR"
          echo "jar=$RELEASE_JAR" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Evgenium SpeedRun v0.1.0-alpha.1

          First installable development build of Evgenium SpeedRun.

          ## Requirements

          - Minecraft Java Edition 26.2
          - Fabric Loader 0.19.3 or newer compatible 0.19.x build
          - Fabric API 0.156.0+26.2
          - Java 25

          ## Included in this build

          - Fabric project foundation and client/common entrypoints
          - client state model prepared for menu, lobby, match, world and RNG systems
          - first EvgeniumMainScreen implementation with future speedrun actions
          - reproducible GitHub Actions build

          ## Important

          This is an early alpha foundation. The custom Evgenium main screen exists in code but does not yet replace Minecraft's vanilla title screen. Lobby networking, synchronized starts and competitive RNG are not implemented yet.
          EOF

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.0-alpha.1 \
            "${{ steps.artifact.outputs.jar }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Evgenium SpeedRun v0.1.0-alpha.1" \
            --notes-file release-notes.md \
            --prerelease
